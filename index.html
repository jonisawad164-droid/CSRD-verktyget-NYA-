<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>CSRD-verktyget v2 - Fastighetsdata</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f6f4;color:#111;font-size:14px}
input,select,button,textarea{font-family:inherit;font-size:14px}
button{cursor:pointer}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:10px}
@media print{
  .no-print{display:none!important}
  body{background:#fff}
  .card{box-shadow:none!important;break-inside:avoid}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script>
"use strict";
var h=React.createElement, useState=React.useState, useEffect=React.useEffect, useMemo=React.useMemo;

var G="#0d4f2f", GL="#1a7a4e", GP="#e8f5ee", RED="#dc2626", AMBER="#d97706", BLUE="#2563eb", PURPLE="#7c3aed";
var STORE_KEY="csrd_fastighetsdata_v2";

var QS=[
  {id:1,cat:"Organisation",q:"Har ni en utsedd ansvarig för hållbarhetsrapportering?"},
  {id:2,cat:"Miljö",q:"Samlar ni in data om koldioxidutsläpp (Scope 1 & 2)?"},
  {id:3,cat:"Miljö",q:"Mäter ni energiförbrukning kontinuerligt per enhet/fastighet?"},
  {id:4,cat:"Miljö",q:"Har ni definierade klimatmål med mätbara delmål?"},
  {id:5,cat:"Socialt",q:"Har ni en dokumenterad jämställdhets- och mångfaldspolicy?"},
  {id:6,cat:"Socialt",q:"Mäter ni sjukfrånvaro och medarbetarnöjdhet regelbundet?"},
  {id:7,cat:"Socialt",q:"Har ni hållbarhetskrav på era leverantörer (due diligence)?"},
  {id:8,cat:"Styrning",q:"Rapporteras hållbarhetsdata regelbundet till styrelsen?"},
  {id:9,cat:"Styrning",q:"Har ni anti-korruptionspolicy och whistleblower-system?"},
  {id:10,cat:"Rapportering",q:"Är er hållbarhetsdata verifierad av extern revisor?"},
  {id:11,cat:"Rapportering",q:"Har ni genomfört en analys av dubbel väsentlighet?"},
  {id:12,cat:"Rapportering",q:"Publicerar ni redan en hållbarhetsrapport?"}
];
var CATS=["Organisation","Miljö","Socialt","Styrning","Rapportering"];

var emptyBuilding={
  name:"", type:"Flerbostadshus", area:"", energyClass:"", energyPerformance:"",
  electricity:"", heat:"", water:"", waste:"", co2:"",
  ovk:"Okänd", declaration:"Okänd", meters:"Okänd", source:"", sourceDate:"", responsible:"", notes:""
};
var emptyCompany={name:"", size:"Stort (>250 anst.)", industry:"Fastigheter", year:new Date().getFullYear(), contact:""};
var emptyEsg={scope1:"",scope2:"",scope3:"",energy:"",renewable:"",water:"",waste:"",recycled:"",employees:"",femaleRatio:"",femaleMgmt:"",sickLeave:"",accidents:"",training:"",boardSize:"",independentBoard:"",femaleBoard:"",antiCorruption:false,whistleblower:false,esgAudit:false};

function N(v){var n=parseFloat(String(v||"").replace(/\s/g,"").replace(",","."));return isFinite(n)?n:0}
function fmt(v){return new Intl.NumberFormat("sv-SE").format(Math.round(N(v)))}
function pct(v){return (Math.round(N(v)*10)/10).toString().replace(".",",")+"%"}
function score(a){return Object.values(a).filter(function(v){return v===true}).length}
function answered(a){return Object.keys(a).length}
function status(s){if(s<=3)return{label:"Inte redo",c:RED,bg:"#fef2f2"}; if(s<=6)return{label:"Tidigt skede",c:AMBER,bg:"#fffbeb"}; if(s<=9)return{label:"På god väg",c:BLUE,bg:"#eff6ff"}; return{label:"Nästan redo",c:"#16a34a",bg:"#f0fdf4"}}
function catScores(a){var m={};QS.forEach(function(q){if(!m[q.cat])m[q.cat]={y:0,t:0};m[q.cat].t++;if(a[q.id]===true)m[q.cat].y++});return CATS.map(function(c){return m[c]?Math.round(m[c].y/m[c].t*100):0})}
function dataScore(esg, buildings){
  var env=["scope1","scope2","energy","renewable","water","waste","recycled"];
  var soc=["employees","femaleRatio","femaleMgmt","sickLeave","accidents","training"];
  var gov=["boardSize","independentBoard","femaleBoard"];
  function p(fields){return Math.round(fields.filter(function(k){return !!esg[k]}).length/fields.length*100)}
  var bFields=["area","energyClass","energyPerformance","electricity","heat","water","ovk","declaration","meters","source"];
  var bp=buildings.length?Math.round(buildings.reduce(function(sum,b){return sum+(bFields.filter(function(k){return !!b[k]&&b[k]!="Okänd"}).length/bFields.length)},0)/buildings.length*100):0;
  return{env:p(env),soc:p(soc),gov:p(gov),building:bp}
}
function totals(buildings){
  return buildings.reduce(function(a,b){a.area+=N(b.area);a.electricity+=N(b.electricity);a.heat+=N(b.heat);a.water+=N(b.water);a.waste+=N(b.waste);a.co2+=N(b.co2);return a},{area:0,electricity:0,heat:0,water:0,waste:0,co2:0});
}
function propertyRisk(b){
  var pts=0, epc=String(b.energyClass||"").toUpperCase();
  if(N(b.energyPerformance)>140)pts+=3; else if(N(b.energyPerformance)>100)pts+=2; else if(N(b.energyPerformance)>75)pts+=1;
  if(["E","F","G"].indexOf(epc)>=0)pts+=2; else if(epc==="D")pts+=1;
  if(b.ovk==="Saknas"||b.ovk==="Utgånget")pts+=1;
  if(b.meters==="Saknas"||b.meters==="Delvis")pts+=1;
  if(!b.source)pts+=1;
  if(pts>=5)return{label:"Hög",c:RED,bg:"#fef2f2"};
  if(pts>=3)return{label:"Medel",c:AMBER,bg:"#fffbeb"};
  return{label:"Låg",c:"#16a34a",bg:"#f0fdf4"};
}
function esrsStatus(ans,esg,buildings){
  return [
    {std:"ESRS 2",name:"Allmänna upplysningar, styrning och dubbel väsentlighet",ok:ans[1]&&ans[8]&&ans[11],partial:ans[1]||ans[8]||ans[11]},
    {std:"ESRS E1",name:"Klimat, energi, utsläpp och omställningsplan",ok:ans[2]&&ans[3]&&ans[4]&&esg.scope1&&esg.scope2,partial:ans[2]||ans[3]||ans[4]||esg.scope1||esg.scope2||buildings.length},
    {std:"ESRS E3",name:"Vattenresurser",ok:!!esg.water||buildings.some(function(b){return !!b.water}),partial:!!esg.water||buildings.some(function(b){return !!b.water})},
    {std:"ESRS E5",name:"Resursanvändning och avfall",ok:!!esg.waste||buildings.some(function(b){return !!b.waste}),partial:!!esg.waste||buildings.some(function(b){return !!b.waste})},
    {std:"ESRS S1",name:"Egna anställda",ok:ans[5]&&ans[6]&&esg.employees,partial:ans[5]||ans[6]||esg.employees},
    {std:"ESRS S2",name:"Arbetstagare i värdekedjan",ok:ans[7],partial:ans[7]},
    {std:"ESRS G1",name:"Affärsetik och anti-korruption",ok:ans[9]&&esg.antiCorruption&&esg.whistleblower,partial:ans[9]||esg.antiCorruption||esg.whistleblower}
  ];
}
function recs(ans,esg,buildings){
  var r=[], gaps=QS.filter(function(q){return ans[q.id]===false});
  if(ans[11]===false) r.push(cardRec("HÖG",RED,"🔍","Genomför dubbel väsentlighetsanalys","Grunden i CSRD/ESRS är att bedöma både företagets påverkan på omvärlden och hur hållbarhetsfrågor påverkar företagets ekonomi.",["Kartlägg intressenter och värdekedja","Bedöm impact materiality och financial materiality","Dokumentera metod, antaganden och beslut","Låt revisor granska arbetsgången"],"ESRS 2 – IRO-1"));
  if(ans[1]===false) r.push(cardRec("HÖG",RED,"👤","Utse ansvarig för CSRD och datakvalitet","Utan tydlig ägare blir datainsamlingen ofta personberoende och svår att verifiera.",["Utse ansvarig och ersättare","Koppla rollen till ekonomi, drift och styrelse","Sätt rutin för månadsvis datainsamling","Skapa revisionsspår för varje datapunkt"],"ESRS 2 – GOV"));
  if(ans[10]===false) r.push(cardRec("HÖG",RED,"✅","Förbered extern verifiering","Hållbarhetsdata behöver kunna följas till källa, datum, metod och ansvarig.",["Lägg in källa för varje fastighet","Spara fakturor, mätarutdrag, OVK och energideklaration","Inför intern kontroll före rapportering","Boka genomgång med revisor"],"ESRS 2 – BP"));
  if(buildings.length===0) r.push(cardRec("DATA",PURPLE,"🏢","Lägg in fastighetsdata","För fastighetsbolag är energidata, mätarstruktur och driftunderlag centrala för rapporteringen.",["Gå till Fastighetsdata","Lägg in area, energiklass, energi, el, värme, vatten och avfall","Ange källa och datum","Koppla ansvarig person till varje fastighet"],"Fastighetsunderlag"));
  buildings.forEach(function(b){
    var risk=propertyRisk(b);
    if(risk.label==="Hög") r.push(cardRec("FASTIGHET",AMBER,"🏢","Prioritera "+(b.name||"fastighet utan namn"),"Fastigheten har hög risknivå baserat på energiprestanda, energiklass, OVK, mätarstruktur eller saknad källa.",["Verifiera energideklaration och OVK","Kontrollera fjärrvärme/el/vattenmätning","Ta fram energikartläggning eller BIM/energianalys","Skapa åtgärdslista: styr, ventilation, värmeåtervinning, injustering"],"ESRS E1/E3/E5"));
  });
  if(!esg.scope1||!esg.scope2) r.push(cardRec("DATA",PURPLE,"📊","Komplettera Scope 1 och Scope 2","Utsläppsdata saknas eller är ofullständig. Detta behövs för klimatrapportering och måluppföljning.",["Hämta bränsledata för Scope 1","Hämta el/fjärrvärmedata och emissionsfaktorer för Scope 2","Dokumentera beräkningsmetod","Uppdatera årligen"],"ESRS E1"));
  if(!esg.employees) r.push(cardRec("DATA",PURPLE,"👥","Komplettera personaldata","ESRS S1 kräver data om personal, arbetsmiljö och mångfald om området är väsentligt.",["Hämta data från HR/lönesystem","Fyll i anställda, könsfördelning, sjukfrånvaro och utbildning","Dokumentera datakälla och ansvarig","Följ upp årligen"],"ESRS S1"));
  if(r.length===0) r.push(cardRec("BRA","#16a34a","🎉","Ni har en stark grund","Fortsätt med kvalitetssäkring, revisionsspår och årlig uppföljning.",["Verifiera data med revisor","Uppdatera dubbel väsentlighet vid förändringar","Fördjupa Scope 3 och leverantörsdata","Koppla åtgärder till budget och investering"],"Nästa nivå"));
  return r.slice(0,10);
}
function cardRec(pri,c,i,t,d,steps,e){return{pri:pri,c:c,bg:c===RED?"#fef2f2":c===AMBER?"#fffbeb":c===PURPLE?"#f5f3ff":"#f0fdf4",i:i,t:t,d:d,steps:steps,e:e}}
function csvEscape(v){return '"'+String(v||"").replace(/"/g,'""')+'"'}
function download(name,text,type){var blob=new Blob([text],{type:type||"text/plain"});var url=URL.createObjectURL(blob);var a=document.createElement("a");a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
function toCSV(buildings){var cols=["name","type","area","energyClass","energyPerformance","electricity","heat","water","waste","co2","ovk","declaration","meters","source","sourceDate","responsible","notes"];var lines=[cols.join(";")];buildings.forEach(function(b){lines.push(cols.map(function(c){return csvEscape(b[c])}).join(";"))});return lines.join("\n")}

var CARD={background:"#fff",borderRadius:14,border:"1px solid #e5e7eb",padding:"20px 22px",marginBottom:14,boxShadow:"0 1px 4px rgba(0,0,0,.05)"};
var INP={width:"100%",padding:"8px 11px",border:"1px solid #d1d5db",borderRadius:8,fontSize:13,background:"#fff",color:"#111",boxSizing:"border-box",outline:"none"};
function Lbl(p){return h("div",{style:{fontSize:12,color:"#4b7a5f",marginBottom:5,fontWeight:700}},p.children)}
function Fld(p){return h("div",null,h(Lbl,null,p.label),p.children)}
function Sec(p){return h("div",{style:{fontSize:11,fontWeight:800,color:"#9ca3af",textTransform:"uppercase",letterSpacing:"0.9px",marginBottom:10,paddingBottom:7,borderBottom:"1px solid #f3f4f6"}},p.children)}
function Btn(p){return h("button",{className:p.className||"no-print",onClick:p.onClick,style:Object.assign({padding:"9px 14px",borderRadius:9,border:p.outline?"1px solid #d1d5db":"none",background:p.outline?"#fff":G,color:p.outline?G:"#fff",fontWeight:800,cursor:"pointer"},p.style||{})},p.children)}
function TextInput(p){return h("input",{style:INP,type:p.type||"text",placeholder:p.placeholder||"",value:p.value,onChange:function(e){p.onChange(e.target.value)}})}
function TextArea(p){return h("textarea",{style:Object.assign({},INP,{minHeight:p.minHeight||90,resize:"vertical",lineHeight:1.5}),placeholder:p.placeholder||"",value:p.value,onChange:function(e){p.onChange(e.target.value)}})}

function RadarChart(props){
  var vals=props.vals,labs=props.labs,cx=200,cy=170,r=120,n=vals.length;
  function pt(i,frac){var ang=(i/n)*2*Math.PI-Math.PI/2;return[cx+r*frac*Math.cos(ang),cy+r*frac*Math.sin(ang)]}
  var poly=vals.map(function(v,i){var p=pt(i,v/100);return p[0]+","+p[1]}).join(" ");
  return h("svg",{viewBox:"0 0 400 340",style:{width:"100%",maxHeight:260}},
    [0.25,0.5,0.75,1].map(function(f,i){return h("polygon",{key:"g"+i,points:labs.map(function(_,j){var p=pt(j,f);return p[0]+","+p[1]}).join(" "),fill:"none",stroke:"#e5e7eb"})}),
    labs.map(function(_,i){var p=pt(i,1);return h("line",{key:"a"+i,x1:cx,y1:cy,x2:p[0],y2:p[1],stroke:"#e5e7eb"})}),
    h("polygon",{points:poly,fill:GL,fillOpacity:.32,stroke:GL,strokeWidth:2}),
    labs.map(function(l,i){var p=pt(i,1.22);return h("text",{key:"l"+i,x:p[0],y:p[1],textAnchor:"middle",dominantBaseline:"middle",fontSize:11,fill:"#4b5563"},l)})
  )
}
function BarChart(props){
  var data=props.data,W=560,H=160,pad=42,barW=70,gap=95,max=Math.max(1,...data.map(function(d){return N(d.v)}));
  return h("svg",{viewBox:"0 0 "+W+" "+H,style:{width:"100%",height:H}},
    data.map(function(d,i){var bh=Math.round(N(d.v)/max*(H-pad-12)),x=62+i*gap,y=H-pad-bh;return h("g",{key:i},
      h("rect",{x:x,y:y,width:barW,height:bh,fill:GL,rx:5}),
      h("text",{x:x+barW/2,y:y-7,textAnchor:"middle",fontSize:11,fill:"#374151"},fmt(d.v)),
      h("text",{x:x+barW/2,y:H-10,textAnchor:"middle",fontSize:11,fill:"#6b7280"},d.n)
    )}),
    h("line",{x1:50,y1:H-pad,x2:W-12,y2:H-pad,stroke:"#e5e7eb"})
  )
}

function App(){
  var loaded=(function(){try{return JSON.parse(localStorage.getItem(STORE_KEY)||"null")}catch(e){return null}})();
  var S0=useState(loaded&&loaded.tab||0), tab=S0[0], setTab=S0[1];
  var S1=useState(loaded&&loaded.company||emptyCompany), co=S1[0], setCo=S1[1];
  var S2=useState(loaded&&loaded.answers||{}), ans=S2[0], setAns=S2[1];
  var S3=useState(loaded&&loaded.esg||emptyEsg), esg=S3[0], setEsg=S3[1];
  var S4=useState(loaded&&loaded.esgTab||0), esgTab=S4[0], setEsgTab=S4[1];
  var S5=useState(loaded&&loaded.buildings||[]), buildings=S5[0], setBuildings=S5[1];
  var S6=useState(emptyBuilding), bform=S6[0], setBform=S6[1];
  var S7=useState(""), q=S7[0], setQ=S7[1];

  var sc=score(ans), ansN=answered(ans), st=status(sc), cvals=catScores(ans), t=totals(buildings), ds=dataScore(esg,buildings), gaps=QS.filter(function(x){return ans[x.id]===false}), rs=recs(ans,esg,buildings), esrs=esrsStatus(ans,esg,buildings);
  useEffect(function(){localStorage.setItem(STORE_KEY,JSON.stringify({tab:tab,company:co,answers:ans,esg:esg,esgTab:esgTab,buildings:buildings}))},[tab,co,ans,esg,esgTab,buildings]);
  function setA(id,v){setAns(function(p){var n=Object.assign({},p);n[id]=v;return n})}
  function setC(k,v){setCo(function(p){var n=Object.assign({},p);n[k]=v;return n})}
  function setE(k,v){setEsg(function(p){var n=Object.assign({},p);n[k]=v;return n})}
  function setB(k,v){setBform(function(p){var n=Object.assign({},p);n[k]=v;return n})}
  function addBuilding(){if(!bform.name){alert("Fyll i fastighetsnamn.");return} setBuildings([{id:Date.now()}.constructor?Object.assign({id:Date.now()},bform):bform].concat(buildings)); setBform(emptyBuilding)}
  function removeBuilding(id){if(confirm("Ta bort fastigheten?"))setBuildings(buildings.filter(function(b){return b.id!==id}))}
  function exportAll(){download("csrd-verktyget-data.json",JSON.stringify({company:co,answers:ans,esg:esg,buildings:buildings},null,2),"application/json")}
  function importAll(file){var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);setCo(d.company||emptyCompany);setAns(d.answers||{});setEsg(d.esg||emptyEsg);setBuildings(d.buildings||[]);alert("Import klar.")}catch(e){alert("Kunde inte läsa JSON-filen.")}};r.readAsText(file)}
  function clearAll(){if(confirm("Rensa all sparad data i verktyget?")){localStorage.removeItem(STORE_KEY);location.reload()}}
  var filtered=buildings.filter(function(b){return (b.name+" "+b.type+" "+b.energyClass+" "+b.source+" "+b.responsible).toLowerCase().includes(q.toLowerCase())});
  var tabs=["🏠 Start","📋 Beredskap","🏢 Fastighetsdata","📊 ESG-data","💡 Analys & råd","📄 Rapport"];

  return h("div",{style:{background:"#f3f6f4",minHeight:"100vh"}},
    h("div",{className:"no-print",style:{background:"linear-gradient(135deg,"+G+","+GL+")",padding:"15px 22px",display:"flex",alignItems:"center",gap:12}},
      h("span",{style:{fontSize:26}},"🌿"),
      h("div",null,h("div",{style:{color:"#fff",fontSize:18,fontWeight:800}},"CSRD-verktyget"),h("div",{style:{color:"#a7d9be",fontSize:11,marginTop:1}},"Fastighetsdata · ESG · Revisionsspår · Bravida-underlag")),
      co.name&&h("div",{style:{marginLeft:"auto",color:"#d8f8e7",fontSize:12,fontWeight:800}},co.name)
    ),
    h("div",{className:"no-print",style:{background:"#fff",borderBottom:"1px solid #e5e7eb",display:"flex",padding:"0 16px",overflowX:"auto",alignItems:"center"}},
      tabs.map(function(x,i){return h("button",{key:i,onClick:function(){setTab(i)},style:{padding:"12px 14px",border:"none",background:"none",fontSize:13,fontWeight:tab===i?800:500,color:tab===i?G:"#6b7280",borderBottom:tab===i?"3px solid "+G:"3px solid transparent",whiteSpace:"nowrap"}},x)}),
      h("div",{style:{marginLeft:"auto",display:"flex",gap:8,alignItems:"center"}},
        ansN>0&&h("span",{style:{background:st.bg,color:st.c,border:"1px solid "+st.c+"44",borderRadius:20,padding:"4px 12px",fontSize:11,fontWeight:800}},sc+"/12 · "+st.label),
        h(Btn,{outline:true,onClick:exportAll,style:{padding:"7px 10px"}},"Export"),
        h("label",{style:{padding:"7px 10px",borderRadius:9,border:"1px solid #d1d5db",background:"#fff",color:G,fontWeight:800,cursor:"pointer",fontSize:14}},"Import",h("input",{type:"file",accept:".json",style:{display:"none"},onChange:function(e){if(e.target.files[0])importAll(e.target.files[0])}})),
        h(Btn,{outline:true,onClick:clearAll,style:{padding:"7px 10px",color:RED}},"Rensa")
      )
    ),
    h("div",{style:{maxWidth:1060,margin:"0 auto",padding:"20px 16px"}},
      tab===0&&h(Start,{co:co,setC:setC,setTab:setTab}),
      tab===1&&h(Readiness,{ans:ans,setA:setA,ansN:ansN,sc:sc,st:st,cvals:cvals}),
      tab===2&&h(Buildings,{buildings:filtered,allBuildings:buildings,bform:bform,setB:setB,addBuilding:addBuilding,removeBuilding:removeBuilding,q:q,setQ:setQ,t:t}),
      tab===3&&h(EsgData,{esg:esg,setE:setE,esgTab:esgTab,setEsgTab:setEsgTab}),
      tab===4&&h(Analysis,{ansN:ansN,sc:sc,st:st,esrs:esrs,ds:ds,rs:rs,buildings:buildings}),
      tab===5&&h(Report,{co:co,ansN:ansN,sc:sc,st:st,gaps:gaps,esg:esg,buildings:buildings,t:t,cvals:cvals,ds:ds,rs:rs,exportAll:exportAll})
    )
  )
}

function Start(p){
  var co=p.co,setC=p.setC,setTab=p.setTab;
  return h("div",null,
    h("div",{style:CARD,className:"card"},
      h("h2",{style:{fontSize:22,fontWeight:800,color:G,marginBottom:8}},"Välkommen till CSRD-verktyget"),
